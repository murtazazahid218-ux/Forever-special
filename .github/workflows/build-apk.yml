
name: Build Forever Special APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip forever-special-first-build.zip -d extracted
          cp -r extracted/. .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --org com.foreverspecial --project-name birthday .

      - name: Install dependencies
        run: flutter pub get

      - name: Set minimum Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              p = Path(name)
              if p.exists():
                  s = p.read_text()
                  s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23")
                  s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
                  p.write_text(s)
          PY

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forever-Special-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          
