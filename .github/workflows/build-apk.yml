
name: Forever Special APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip forever-special-first-build.zip -d extracted
          cp -r extracted/. .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --org com.foreverspecial --project-name forever_special .

      - name: Set minimum SDK to 23
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 23', s)
          s = re.sub(r'minSdk\s*=\s*.*', 'minSdk = 23', s)
          p.write_text(s)
          print("Updated Android minimum SDK to 23")
          print([line.strip() for line in s.splitlines() if "minSdk" in line])
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Verify minimum SDK
        run: grep -n "minSdk" android/app/build.gradle

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forever-Special-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          
